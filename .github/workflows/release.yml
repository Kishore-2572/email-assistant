name: Release

# Manually triggered version release, mirroring the pattern used by
# IABTechLab/iabgpp-es: bump a version, run tests, tag the commit, and
# publish an artifact for that exact version — only if the tag is new.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0, no leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag does not already exist
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists. A released version is immutable — pick a new version number for these changes. Existing tags: $(git tag -l 'v*' | tail -5 | tr '\n' ' ')"
            exit 1
          fi
          echo "Tag v$VERSION does not exist yet — proceeding with release."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Update VERSION file
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Releasing v$VERSION"
          echo "$VERSION" > VERSION

      - name: Commit, tag, and push
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add VERSION
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes

name: Release

# Manually triggered version release, mirroring the pattern used by
# IABTechLab/iabgpp-es: bump a version, run tests, tag the commit, and
# publish an artifact for that exact version — only if the tag is new.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0, no leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag does not already exist
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists. A released version is immutable — pick a new version number for these changes. Existing tags: $(git tag -l 'v*' | tail -5 | tr '\n' ' ')"
            exit 1
          fi
          echo "Tag v$VERSION does not exist yet — proceeding with release."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Update VERSION file
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Releasing v$VERSION"
          echo "$VERSION" > VERSION

      - name: Update CHANGELOG
        run: |
          python3 - "${{ github.event.inputs.version }}" <<'EOF'
          import re, sys, datetime
          version = sys.argv[1]
          date = datetime.date.today().isoformat()
          path = "CHANGELOG.md"
          text = open(path).read()
          pattern = r"(## \[Unreleased\]\n)(.*?)(\n## \[|\Z)"
          def repl(m):
              return f"{m.group(1)}\n## [{version}] — {date}\n{m.group(2)}{m.group(3)}"
          new_text, n = re.subn(pattern, repl, text, count=1, flags=re.S)
          if n == 0:
              sys.exit("Could not find an '## [Unreleased]' section in CHANGELOG.md")
          open(path, "w").write(new_text)
          EOF

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "${{ github.event.inputs.version }}" <<'EOF'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.S)
          body = (m.group(1) if m else "").strip()
          open("release_notes.md", "w").write(body)
          EOF

      - name: Commit, tag, and push
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add VERSION CHANGELOG.md
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -s release_notes.md ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file release_notes.md
          else
            echo "No CHANGELOG entry for v$VERSION — falling back to auto-generated notes."
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
